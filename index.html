/* pengaman ringan (dari Lompat Waktu): tanpa klik kanan, salin, potong, tempel, dan Ctrl+U, tanpa pemberitahuan. */
(function () {
  function cegah(e) { var t = e.target && e.target.tagName; if (t === 'INPUT' || (e.type === 'copy' && t === 'TEXTAREA') || (e.type === 'contextmenu' && e.target.classList && e.target.classList.contains('gambar-sertifikat'))) return; e.preventDefault(); }
  ['contextmenu', 'copy', 'cut', 'paste'].forEach(function (n) { document.addEventListener(n, cegah, true); });
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) e.preventDefault(); }, true);
})();
</script>
